
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Berkenalan!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: transparent;
  color: #563b25;
}

.container {
  max-width: 850px;
  margin: auto;
  text-align: center;
  padding-top: 35px;
}

h1 {
  color: #e9a43c;
  font-size: 32px;
  margin-bottom: 8px;
  text-shadow: 1px 2px 2px #f5dfb7;
}

/* TULISAN KUNING */
.subtitle {
  font-family: 'Trebuchet MS', cursive;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 25px;
  color: #f2b632;
  text-shadow: 1px 2px 2px #f5dfb7;
}

.dialog-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  max-width: 700px;
  width: 95%;
  min-height: 210px;
  margin: 20px auto;
}

.face {
  width: 175px;
  height: 190px;
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 5px 5px #00000018);
  animation: watakMuncul .8s cubic-bezier(.2,.8,.3,1);
}

.bubble {
  background: #fff0c9;
  border: 3px solid #e9b85f;
  border-radius: 25px;
  padding: 22px;
  text-align: left;
  flex: 1;
  color: #563b25;
  font-size: 20px;
  line-height: 1.6;
  box-shadow: 0 5px 12px #00000012;
  animation: dialogMuncul .6s ease;
}

.bubble strong {
  color: #d78329;
  font-size: 19px;
}

.bubble p {
  margin: 8px 0 0;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 28px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: #eda83e;
  cursor: pointer;
  box-shadow: 0 4px 0 #c9852b;
  transition: .2s;
}

button:hover {
  transform: translateY(-3px);
  background: #dc922e;
}

#replay {
  display: none;
  background: #69ad72;
  box-shadow: 0 4px 0 #47854f;
}

/* BUTANG MUZIK */
#butangLagu {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 1000;
  background: #ffdf55;
  color: #593313;
  border: 2px solid #d99b37;
  border-radius: 30px;
  padding: 11px 18px;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 3px 8px #00000020;
}

#butangLagu:hover {
  background: #ffe995;
}

@keyframes watakMuncul {
  from {
    opacity: 0;
    transform: translateX(-35px) scale(.8) rotate(-5deg);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1) rotate(0);
  }
}

@keyframes dialogMuncul {
  from {
    opacity: 0;
    transform: translateY(18px) scale(.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media(max-width:500px) {
  body {
    padding: 10px;
  }

  .container {
    padding-top: 45px;
  }

  h1 {
    font-size: 25px;
  }

  .subtitle {
    font-size: 18px;
  }

  .dialog-row {
    gap: 8px;
    min-height: 160px;
  }

  .face {
    width: 105px;
    height: 145px;
  }

  .bubble {
    font-size: 16px;
    padding: 13px;
    border-radius: 18px;
  }

  .bubble strong {
    font-size: 16px;
  }

  button {
    font-size: 14px;
    padding: 12px 20px;
  }

  #butangLagu {
    font-size: 12px;
    padding: 9px 13px;
  }
}
</style>
</head>

<body>

<audio id="laguLatar" loop preload="auto">
  <source src="./lagu-latar.mp3" type="audio/mpeg">
</audio>

<button onclick="kawalLagu()" id="butangLagu">
  🔇 Mainkan Muzik
</button>

<div class="container">

  <h1>JOM BERKENALAN! 👋</h1>

  <p class="subtitle">
    Mari Berkenalan Dengan Kawan-Kawan! 🌟
  </p>

  <div class="dialog-row">

    <img id="face" class="face" src="upin.png" alt="Upin">

    <div class="bubble">
      <strong id="name">UPIN</strong>
      <p id="words">
        Hai kawan-kawan! Selamat datang ke dunia Pendidikan Islam!
      </p>
    </div>

  </div>

  <button id="start" onclick="startDialogue()">
    ▶ MULA DENGAR DIALOG
  </button>

  <button id="replay" onclick="startDialogue()">
    ↻ DENGAR SEMULA
  </button>

</div>

<script>

// KAWAL MUZIK LATAR
const lagu = document.getElementById("laguLatar");
const butang = document.getElementById("butangLagu");

function kemasKiniButang() {
  butang.textContent = lagu.paused
    ? "🔇 Mainkan Muzik"
    : "🔊 Tutup Muzik";
}

function kawalLagu() {
  if (lagu.paused) {
    lagu.play()
      .then(kemasKiniButang)
      .catch(function() {
        alert("Lagu tidak dapat dimainkan. Sila semak fail MP3.");
      });
  } else {
    lagu.pause();
    kemasKiniButang();
  }
}

window.addEventListener("load", function() {
  lagu.play()
    .then(kemasKiniButang)
    .catch(kemasKiniButang);
});

// DIALOG UPIN DAN IPIN
const dialogues = [

  {
    name: "UPIN",
    image: "upin.png",
    words: "Hai, kawan-kawan! Selamat datang ke dunia Pendidikan Islam! Kami gembira dapat berkenalan dengan kamu semua!"
  },

  {
    name: "IPIN",
    image: "ipin.png",
    words: "Betul, betul, betul! Seronoknya dapat belajar bersama kawan-kawan! Mesti banyak perkara menarik yang kita boleh terokai!"
  },

  {
    name: "UPIN",
    image: "upin.png",
    words: "Di sini, kita akan belajar sambil bermain dan meneroka pelbagai perkara baharu. Seronok, kan?"
  },

  {
    name: "IPIN",
    image: "ipin.png",
    words: "Hehehe! Jadi, kawan-kawan jangan malu-malu, ya! Mari kita belajar bersama-sama!"
  }

];

let current = 0;
let timer;

function showDialogue() {

  const item = dialogues[current];

  const face = document.getElementById("face");
  const name = document.getElementById("name");
  const words = document.getElementById("words");

  face.style.animation = "none";
  void face.offsetWidth;
  face.style.animation = "watakMuncul .8s ease";

  const bubble = document.querySelector(".bubble");
  bubble.style.animation = "none";
  void bubble.offsetWidth;
  bubble.style.animation = "dialogMuncul .6s ease";

  face.style.display = "block";
  face.src = item.image;
  face.alt = item.name;

  name.textContent = item.name;
  words.textContent = item.words;

  current++;

  if (current < dialogues.length) {
    timer = setTimeout(showDialogue, 6000);
  } else {
    timer = setTimeout(finishDialogue, 6000);
  }
}

function startDialogue() {

  clearTimeout(timer);
  current = 0;

  document.getElementById("start").style.display = "none";
  document.getElementById("replay").style.display = "none";

  showDialogue();
}

function finishDialogue() {

  const face = document.getElementById("face");

  face.style.display = "none";

  document.getElementById("name").textContent = "UPIN & IPIN";

  document.getElementById("words").textContent =
    "Terima kasih kerana sudi berkenalan dengan kami! Jom kita kenali guru kita pula!";

  document.getElementById("replay").style.display = "inline-block";
}

</script>

</body>
</html>
