
<style>
.dialog-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  max-width: 700px;
  width: 95%;
  margin: 20px auto;
  animation: muncul .6s ease;
}

.face {
  width: 150px;
  height: 170px;
  object-fit: contain;
  flex-shrink: 0;
}

.bubble {
  background: #fff0c9;
  border: 3px solid #e9b85f;
  border-radius: 25px;
  padding: 20px;
  text-align: left;
  flex: 1;
  color: #563b25;
  font-size: 20px;
}

@keyframes muncul {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width:500px) {
  .dialog-row { gap: 8px; }
  .face { width: 105px; height: 130px; }
  .bubble { font-size: 16px; padding: 13px; }
}
</style>

<div class="dialog-row">
  <img id="face" class="face" src="upin.png" alt="Upin">
  <div class="bubble">
    <strong id="name">UPIN</strong>
    <p id="words">Hai kawan-kawan! Selamat datang ke kelas Pendidikan Islam!</p>
  </div>
</div>

<button onclick="nextDialogue()">DIALOG SETERUSNYA →</button>

<script>
const dialogues = [
  {
    name: "UPIN",
    image: "upin.png",
    words: "Hai kawan-kawan! Selamat datang ke kelas Pendidikan Islam!"
  },
  {
    name: "IPIN",
    image: "ipin.png",
    words: "Betul, betul, betul! Seronoknya dapat belajar bersama!"
  },
  {
    name: "MAIL",
    image: "mail.png",
    words: "Hari ini kita nak belajar tajuk apa?"
  },
  {
    name: "UPIN",
    image: "upin.png",
    words: "Kita akan belajar tentang Hadis Memuliakan Tetamu!"
  },
  {
    name: "IPIN",
    image: "ipin.png",
    words: "Jom kawan-kawan! Kita belajar adab memuliakan tetamu!"
  }
];

let current = 0;

function nextDialogue() {
  if (current < dialogues.length - 1) {
    current++;
    showDialogue();
  }
}

function showDialogue() {
  const item = dialogues[current];

  document.getElementById("face").src = item.image;
  document.getElementById("face").alt = item.name;
  document.getElementById("name").textContent = item.name;
  document.getElementById("words").textContent = item.words;
}

</script>
