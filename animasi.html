
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rembo Kejar Upin dan Ipin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 12px;
  font-family: Arial, sans-serif;
  background: #e8f8dc;
  text-align: center;
}

h1 {
  color: #287d3d;
  font-size: 25px;
}

.scene {
  position: relative;
  width: 100%;
  max-width: 950px;
  height: 340px;
  margin: 25px auto;
  overflow: hidden;
  border: 4px solid white;
  border-radius: 22px;
  background: linear-gradient(
    to bottom,
    #8bd5ff 0%,
    #dff5ff 68%,
    #8dd36c 68%,
    #5bab42 100%
  );
}

.sun {
  position: absolute;
  top: 15px;
  right: 45px;
  font-size: 48px;
}

.cloud {
  position: absolute;
  top: 35px;
  font-size: 40px;
}

.cloud1 { left: 15%; }
.cloud2 { left: 55%; }

.house {
  position: absolute;
  bottom: 55px;
  right: 12%;
  font-size: 65px;
}

.tree {
  position: absolute;
  bottom: 55px;
  left: 8%;
  font-size: 65px;
}

.characters {
  position: absolute;
  bottom: 35px;
  left: -280px;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  white-space: nowrap;
  animation: running 8s linear infinite;
  z-index: 3;
}

.character {
  font-size: 75px;
  display: inline-block;
  animation: bounce 0.35s infinite alternate;
}

.rembo {
  font-size: 80px;
  animation-delay: 0.1s;
}

.upin {
  animation-delay: 0.2s;
}

.ipin {
  animation-delay: 0.3s;
}

@keyframes running {
  0% {
    left: -280px;
  }
  100% {
    left: 110%;
  }
}

@keyframes bounce {
  from {
    transform: translateY(0) rotate(-5deg);
  }
  to {
    transform: translateY(-14px) rotate(5deg);
  }
}

.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35px;
  background: #55a344;
  border-top: 4px solid #408c32;
}

button {
  background: #2fa451;
  color: white;
  padding: 13px 28px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #207c3b;
}
</style>
</head>

<body>

<h1>🏃 REMBO KEJAR UPIN DAN IPIN! 🏃</h1>

<div class="scene" id="scene">

  <div class="sun">☀️</div>
  <div class="cloud cloud1">☁️</div>
  <div class="cloud cloud2">☁️</div>

  <div class="tree">🌳</div>
  <div class="house">🏡</div>

  <div class="characters" id="characters">

    <!-- REMBO MENGEJAR -->
    <span class="character rembo">🐕</span>

    <!-- UPIN -->
    <span class="character upin">👦🏻</span>

    <!-- IPIN -->
    <span class="character ipin">👦🏻</span>

  </div>

  <div class="ground"></div>

</div>

<button onclick="restartAnimation()">
  🔄 Ulang Animasi
</button>

<script>
function restartAnimation() {
  const characters = document.getElementById("characters");

  characters.style.animation = "none";
  void characters.offsetWidth;
  characters.style.animation = "running 8s linear infinite";
}
</script>

</body>
</html>
