
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rembo Kejar Upin dan Ipin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #e7f8dc;
}

h1 {
  color: #267d3d;
  font-size: 26px;
}

.subtitle {
  color: #56745b;
  font-size: 15px;
}

.scene {
  position: relative;
  max-width: 950px;
  height: 380px;
  margin: 25px auto;
  overflow: hidden;
  border: 5px solid white;
  border-radius: 25px;
  background: linear-gradient(
    #83d4ff 0%,
    #d9f3ff 65%,
    #9bdc76 65%,
    #5eb64d 100%
  );
}

/* MATAHARI DAN AWAN */

.sun {
  position: absolute;
  right: 70px;
  top: 20px;
  font-size: 55px;
}

.cloud {
  position: absolute;
  top: 35px;
  font-size: 45px;
  animation: cloudMove 12s linear infinite;
}

.cloud.one {
  left: 10%;
}

.cloud.two {
  left: 65%;
  animation-delay: -6s;
}

@keyframes cloudMove {
  from { transform: translateX(0); }
  to { transform: translateX(150px); }
}

/* LATAR KAMPUNG BERGERAK */

.village {
  position: absolute;
  bottom: 45px;
  width: 200%;
  height: 130px;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  font-size: 75px;
  animation: villageMove 7s linear infinite;
}

@keyframes villageMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* WATAK */

.chase-group {
  position: absolute;
  bottom: 38px;
  left: -300px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  z-index: 3;
  animation: chaseMove 9s linear infinite;
}

.runner {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.character {
  display: inline-block;
  font-size: 78px;
  animation: runningBounce 0.28s infinite alternate;
}

.rembo {
  font-size: 85px;
  animation-delay: 0.1s;
}

.upin {
  animation-delay: 0.15s;
}

.ipin {
  animation-delay: 0.25s;
}

.name {
  font-size: 12px;
  font-weight: bold;
  color: #245c31;
  background: white;
  padding: 4px 8px;
  border-radius: 12px;
  margin-bottom: 3px;
}

@keyframes chaseMove {
  0% {
    left: -300px;
  }
  100% {
    left: 110%;
  }
}

@keyframes runningBounce {
  from {
    transform: translateY(0) rotate(-8deg);
  }
  to {
    transform: translateY(-18px) rotate(8deg);
  }
}

/* TANAH */

.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 38px;
  background: #56a944;
  border-top: 5px solid #438d35;
  z-index: 4;
}

/* BUTANG */

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px;
}

button {
  padding: 13px 25px;
  border: none;
  border-radius: 25px;
  background: #2eaa55;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #217c3c;
}

.stop {
  background: #e58b36;
}

.stop:hover {
  background: #c76d20;
}

@media(max-width: 500px) {
  .scene {
    height: 300px;
  }

  .character {
    font-size: 58px;
  }

  .rembo {
    font-size: 65px;
  }

  .village {
    font-size: 55px;
  }
}
</style>
</head>

<body>

<h1>🏃 REMBO KEJAR UPIN DAN IPIN! 🏃</h1>

<p class="subtitle">
Alamak! Cepat lari! Rembo sedang mengejar mereka! 😂
</p>

<div class="scene" id="scene">

  <div class="sun">☀️</div>

  <div class="cloud one">☁️</div>
  <div class="cloud two">☁️</div>

  <!-- LATAR KAMPUNG -->
  <div class="village">
    <span>🌳</span>
    <span>🏡</span>
    <span>🌴</span>
    <span>🏠</span>
    <span>🌳</span>
    <span>🏡</span>
    <span>🌴</span>
    <span>🏠</span>
  </div>

  <!-- WATAK BERLARI -->
  <div class="chase-group" id="chaseGroup">

    <!-- REMBO DI BELAKANG -->
    <div class="runner">
      <span class="name">REMBO</span>
      <span class="character rembo">🪿</span>
    </div>

    <!-- UPIN -->
    <div class="runner">
      <span class="name">UPIN</span>
      <span class="character upin">🧢👦🏻</span>
    </div>

    <!-- IPIN -->
    <div class="runner">
      <span class="name">IPIN</span>
      <span class="character ipin">👦🏻</span>
    </div>

  </div>

  <div class="ground"></div>

</div>

<!-- KAWALAN ANIMASI -->
<div class="controls">

  <button onclick="startAnimation()">
    ▶️ Mula Lari
  </button>

  <button class="stop" onclick="stopAnimation()">
    ⏸ Berhenti
  </button>

  <button onclick="restartAnimation()">
    🔄 Ulang Semula
  </button>

</div>

<script>
const group = document.getElementById("chaseGroup");
const village = document.querySelector(".village");

function startAnimation() {
  group.style.animationPlayState = "running";
  village.style.animationPlayState = "running";
}

function stopAnimation() {
  group.style.animationPlayState = "paused";
  village.style.animationPlayState = "paused";
}

function restartAnimation() {
  group.style.animation = "none";
  village.style.animation = "none";

  void group.offsetWidth;
  void village.offsetWidth;

  group.style.animation = "chaseMove 9s linear infinite";
  village.style.animation = "villageMove 7s linear infinite";
}
</script>

</body>
</html>
