<h1>Jom Belajar Memuliakan Tetamu!</h1>
<p class="subtitle">Mari ikuti perbualan Fizi dan Ehsan.</p>

<div class="characters">

    <div id="fizi" class="character">
        <img src="fizi.png" alt="Fizi">
        <p>Fizi</p>
    </div>

    <div id="ehsan" class="character">
        <img src="ehsan.png" alt="Ehsan">
        <p>Ehsan</p>
    </div>

</div>

<div class="dialogue-box" id="dialogueBox">

    <h3 id="speaker">FIZI</h3>

    <p id="dialogueText"></p>

    <div class="buttons">
        <button id="previousButton" onclick="previousDialogue()">
            Sebelumnya
        </button>

        <button id="nextButton" onclick="nextDialogue()">
            Seterusnya
        </button>
    </div>

    <div id="progress"></div>

</div>
