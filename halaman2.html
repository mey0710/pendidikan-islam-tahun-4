
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Berkenalan | Pendidikan Islam Tahun 4</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #fff8e8, #e7f5ff, #fff0dc);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

h1 {
    color: #a65c24;
    font-size: clamp(32px, 6vw, 48px);
    margin-bottom: 8px;
    animation: titleIn 1s ease;
}

.subtitle {
    color: #66523e;
    font-size: 18px;
    margin-bottom: 25px;
}

.character-area {
    height: 280px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.character {
    width: 230px;
    height: 270px;
    object-fit: contain;
    filter: drop-shadow(0 8px 7px rgba(0,0,0,0.15));
    animation: characterIn 0.8s ease;
}

.dialogue-box {
    background: white;
    border: 4px solid #f5c45e;
    border-radius: 25px;
    padding: 22px;
    max-width: 650px;
    min-height: 125px;
    margin: 0 auto 25px;
    box-shadow: 0 7px 18px rgba(0,0,0,0.10);
    animation: bubbleIn 0.7s ease;
}

.name {
    color: #df842c;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 10px;
}

.words {
    color: #444;
    font-size: 21px;
    line-height: 1.5;
}

.start-button {
    border: none;
    border-radius: 35px;
    padding: 17px 30px;
    background: #f2a93b;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #c77d20;
    transition: 0.2s;
}

.start-button:hover {
    background: #e99525;
    transform: translateY(-3px);
}

.start-button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #c77d20;
}

.status {
    color: #8a704f;
    font-size: 14px;
    margin-top: 17px;
}

@keyframes titleIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes characterIn {
    from {
        opacity: 0;
        transform: translateY(35px) scale(0.85);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes bubbleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

@media (max-width: 600px) {
    .character-area {
        height: 230px;
    }

    .character {
        height: 220px;
        width: 190px;
    }

    .words {
        font-size: 18px;
    }

    .start-button {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🌟 Jom Berkenalan! 🌟</h1>

    <div class="subtitle">
        Selamat datang ke kelas Pendidikan Islam Tahun 4
    </div>

    <div class="character-area">
        <img
            id="characterImage"
            class="character"
            src="upin.png"
            alt="Upin"
        >
    </div>

    <div class="dialogue-box" id="dialogueBox">
        <div class="name" id="characterName">
            Upin
        </div>

        <div class="words" id="characterWords">
            Hai kawan-kawan! Selamat datang ke kelas Pendidikan Islam!
        </div>
    </div>

    <button class="start-button" id="startButton" onclick="startDialogue()">
        🔊 Dengar Dialog Upin & Ipin
    </button>

    <div class="status" id="status">
        Tekan butang untuk memulakan dialog.
    </div>

</div>

<script>
const dialogues = [
    {
        name: "Upin",
        image: "upin.png",
        words: "Hai kawan-kawan! Selamat datang ke kelas Pendidikan Islam!"
    },
    {
        name: "Ipin",
        image: "ipin.png",
        words: "Betul, betul, betul! Seronoknya dapat belajar bersama!"
    },
    {
        name: "Mail",
        image: "mail.png",
        words: "Hari ini kita nak belajar tajuk apa?"
    },
    {
        name: "Upin",
        image: "upin.png",
        words: "Kita akan belajar tentang Hadis Memuliakan Tetamu!"
    },
    {
        name: "Ipin",
        image: "ipin.png",
        words: "Jom kawan-kawan! Kita belajar adab memuliakan tetamu!"
    }
];

let current = 0;
let timer = null;
let playing = false;

function showDialogue() {
    const person = dialogues[current];

    const image = document.getElementById("characterImage");
    const name = document.getElementById("characterName");
    const words = document.getElementById("characterWords");
    const box = document.getElementById("dialogueBox");

    image.style.animation = "none";
    box.style.animation = "none";

    void image.offsetWidth;

    image.src = person.image;
    image.alt = "Watak " + person.name;
    name.textContent = person.name;
    words.textContent = person.words;

    image.style.animation = "characterIn 0.8s ease";
    box.style.animation = "bubbleIn 0.7s ease";

    current++;

    if (current >= dialogues.length) {
        clearInterval(timer);
        playing = false;

        document.getElementById("startButton").style.display = "inline-block";
        document.getElementById("startButton").textContent = "🔁 Dengar Semula Dialog";
        document.getElementById("status").textContent =
            "Tahniah! Dialog perkenalan telah selesai.";
    }
}

function startDialogue() {
    if (playing) return;

    current = 0;
    playing = true;

    document.getElementById("startButton").style.display = "none";
    document.getElementById("status").textContent =
        "Sedang mendengar dialog...";

    showDialogue();

    if (playing) {
        timer = setInterval(showDialogue, 5000);
    }
}
</script>

</body>
</html>
