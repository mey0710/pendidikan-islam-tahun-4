
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman 2 - Jom Berkenalan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff1d0;
  color: #70472b;
}

.page {
  min-height: 100vh;
  padding: 30px 15px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    linear-gradient(#fff0c9aa, #fff0c9aa),
    url("https://lh3.googleusercontent.com/d/12H7vBoKpv5cKcmAD6gFQYwSoihUVFveu");
  background-size: cover;
  background-position: center;
}

h1 {
  font-size: clamp(27px, 5vw, 42px);
  color: #92552c;
  margin-bottom: 8px;
}

.intro {
  font-size: 18px;
  margin-bottom: 25px;
}

.dialogue-card {
  width: min(95%, 720px);
  min-height: 300px;
  background: #fffdf2;
  border: 4px solid #e8bd78;
  border-radius: 25px;
  padding: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  box-shadow: 0 8px 25px #694a2833;
}

.character {
  width: 180px;
  height: 200px;
  object-fit: contain;
  flex-shrink: 0;
}

.speech {
  flex: 1;
  background: #fff0c9;
  border: 3px solid #e5b75e;
  border-radius: 22px;
  padding: 20px;
  text-align: left;
}

.name {
  font-size: 23px;
  font-weight: bold;
  color: #a65c2a;
}

.words {
  font-size: 20px;
  line-height: 1.5;
}

.counter {
  font-size: 14px;
  color: #8c704f;
  margin-top: 15px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 25px;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  background: #df923b;
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #bd702d;
}

.back {
  background: #92765b;
}

.finish {
  background: #60945b;
  display: none;
}

@media(max-width: 550px) {
  .dialogue-card {
    flex-direction: column;
    gap: 8px;
    padding: 18px;
  }

  .character {
    width: 145px;
    height: 150px;
  }

  .speech {
    width: 100%;
    text-align: center;
  }

  .words {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<main class="page">

  <h1>JOM BERKENALAN!</h1>

  <p class="intro">
    Mari kita berkenalan dengan kawan-kawan Upin & Ipin!
  </p>

  <div class="dialogue-card">

    <img id="characterImage"
         class="character"
         src="upin.png"
         alt="Watak Upin">

    <div class="speech">
      <div id="characterName" class="name">UPIN</div>
      <p id="characterWords" class="words">
        Hai kawan-kawan! Selamat datang ke kelas Pendidikan Islam!
      </p>
      <div id="counter" class="counter">Dialog 1 daripada 5</div>
    </div>

  </div>

  <div class="buttons">

    <button class="back" onclick="history.back()">
      ← KEMBALI
    </button>

    <button id="nextButton" onclick="nextDialogue()">
      SETERUSNYA →
    </button>

    <button id="finishButton" class="finish"
            onclick="window.location.href='index.html'">
      SELESAI →
    </button>

  </div>

</main>

<script>
const dialogues = [
  {
    name: "UPIN",
    image: "upin.png",
    words: "Hai kawan-kawan! Selamat datang ke kelas Pendidikan Islam!"
  },
  {
    name: "IPIN",
    image: "ipin.png",
    words: "Betul, betul, betul! Seronoknya dapat belajar bersama!"
  },
  {
    name: "MAIL",
    image: "mail.png",
    words: "Hari ini kita nak belajar tajuk apa?"
  },
  {
    name: "UPIN",
    image: "upin.png",
    words: "Kita akan belajar tentang Hadis Memuliakan Tetamu!"
  },
  {
    name: "IPIN",
    image: "ipin.png",
    words: "Jom kawan-kawan! Kita belajar adab memuliakan tetamu!"
  }
];

let current = 0;

function showDialogue() {
  const item = dialogues[current];

  document.getElementById("characterImage").src = item.image;
  document.getElementById("characterImage").alt = item.name;
  document.getElementById("characterName").textContent = item.name;
  document.getElementById("characterWords").textContent = item.words;
  document.getElementById("counter").textContent =
    "Dialog " + (current + 1) + " daripada " + dialogues.length;

  const last = current === dialogues.length - 1;

  document.getElementById("nextButton").style.display =
    last ? "none" : "inline-block";

  document.getElementById("finishButton").style.display =
    last ? "inline-block" : "none";
}

function nextDialogue() {
  if (current < dialogues.length - 1) {
    current++;
    showDialogue();
  }
}

showDialogue();
</script>

</body>
</html>
