
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Berkenalan!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: transparent;
  color: #59452f;
}

.container {
  max-width: 850px;
  margin: auto;
  text-align: center;
  background: transparent;
}

h1 {
  color: #e69b36;
  font-size: 32px;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 17px;
  margin-bottom: 25px;
}

.characters {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 35px;
  margin: 20px auto;
}

.character {
  width: 40%;
  max-width: 210px;
  transition: 0.3s ease;
  opacity: 0.55;
  transform: scale(0.92);
}

.character img {
  width: 100%;
  height: 230px;
  object-fit: contain;
}

.character.active {
  opacity: 1;
  transform: scale(1.08);
}

.name {
  font-weight: bold;
  font-size: 20px;
  margin-top: 5px;
  color: #d98227;
}

.dialogue {
  background: #fff7e9;
  border: 3px solid #f3bd65;
  border-radius: 20px;
  padding: 22px;
  margin: 20px auto;
  max-width: 650px;
  min-height: 115px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  line-height: 1.5;
  font-weight: bold;
}

button {
  background: #f2a83b;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
  transition: 0.2s;
}

button:hover {
  background: #dc8624;
  transform: scale(1.04);
}

#nextButton {
  display: none;
  background: #69ad72;
}

@media (max-width: 500px) {
  h1 {
    font-size: 25px;
  }

  .character img {
    height: 170px;
  }

  .dialogue {
    font-size: 18px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>JOM BERKENALAN! 👋</h1>

  <p class="subtitle">
    Mari kita berkenalan dengan kawan-kawan kita!
  </p>

  <div class="characters">

    <div class="character" id="upin">
      <img src="upin.png" alt="Upin">
      <div class="name">UPIN</div>
    </div>

    <div class="character" id="ipin">
      <img src="ipin.png" alt="Ipin">
      <div class="name">IPIN</div>
    </div>

  </div>

  <div class="dialogue" id="dialogue">
    Hai kawan-kawan! Tekan butang di bawah untuk bermula!
  </div>

  <button id="startButton" onclick="startDialogue()">
    ▶ MULA DENGAR DIALOG
  </button>

  <button id="nextButton" onclick="goNext()">
    HALAMAN SETERUSNYA ➜
  </button>

</div>

<script>

const dialogues = [
  {
    character: "upin",
    name: "UPIN",
    text: "Hai, kawan-kawan! Selamat datang ke dunia Pendidikan Islam!"
  },
  {
    character: "ipin",
    name: "IPIN",
    text: "Betul, betul, betul! Seronoknya dapat belajar bersama kawan-kawan!"
  },
  {
    character: "upin",
    name: "UPIN",
    text: "Jom kita teroka sesuatu yang menarik hari ini!"
  },
  {
    character: "ipin",
    name: "IPIN",
    text: "Jangan lupa bersedia, ya! Kita akan belajar bersama-sama!"
  }
];

let current = 0;
let timer;

function showDialogue() {
  const item = dialogues[current];

  document.getElementById("dialogue").textContent =
    item.name + ": " + item.text;

  document.getElementById("upin").classList.remove("active");
  document.getElementById("ipin").classList.remove("active");

  document.getElementById(item.character).classList.add("active");

  current++;

  if (current < dialogues.length) {
    timer = setTimeout(showDialogue, 4500);
  } else {
    timer = setTimeout(finishDialogue, 4500);
  }
}

function startDialogue() {
  current = 0;

  document.getElementById("startButton").style.display = "none";
  document.getElementById("nextButton").style.display = "none";

  showDialogue();
}

function finishDialogue() {
  document.getElementById("dialogue").textContent =
    "Hebat! Sekarang, mari kita berkenalan dengan guru pula! 😊";

  document.getElementById("upin").classList.remove("active");
  document.getElementById("ipin").classList.remove("active");

  document.getElementById("nextButton").style.display = "inline-block";
}

function goNext() {
  window.location.href = "halaman3.html";
}

</script>

</body>
</html>
