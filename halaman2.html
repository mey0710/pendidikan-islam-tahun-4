
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Berkenalan!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: transparent;
  color: #59452f;
}

.container {
  max-width: 850px;
  margin: auto;
  text-align: center;
}

h1 {
  color: #e69b36;
  font-size: 32px;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 17px;
  margin-bottom: 20px;
}

.character-area {
  min-height: 260px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 15px auto;
}

.character {
  display: none;
  animation: muncul 0.7s ease;
}

.character.active {
  display: block;
}

.character img {
  width: 220px;
  height: 240px;
  object-fit: contain;
}

.name {
  font-size: 21px;
  font-weight: bold;
  color: #d98227;
}

.dialogue {
  background: #fff7e9;
  border: 3px solid #f3bd65;
  border-radius: 20px;
  padding: 22px;
  margin: 15px auto 22px;
  max-width: 650px;
  min-height: 110px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 21px;
  line-height: 1.5;
  font-weight: bold;
  animation: muncul 0.5s ease;
}

button {
  background: #f2a83b;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #dc8624;
}

#replayButton {
  display: none;
  background: #69ad72;
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 500px) {
  h1 {
    font-size: 25px;
  }

  .character img {
    width: 180px;
    height: 210px;
  }

  .character-area {
    min-height: 230px;
  }

  .dialogue {
    font-size: 18px;
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>JOM BERKENALAN! 👋</h1>

  <p class="subtitle">
    Mari kita berkenalan dengan kawan-kawan kita!
  </p>

  <div class="character-area">

    <div class="character" id="upin">
      <img src="upin.png" alt="Upin">
      <div class="name">UPIN</div>
    </div>

    <div class="character" id="ipin">
      <img src="ipin.png" alt="Ipin">
      <div class="name">IPIN</div>
    </div>

  </div>

  <div class="dialogue" id="dialogue">
    Hai kawan-kawan! Tekan butang di bawah untuk bermula!
  </div>

  <button id="startButton" onclick="startDialogue()">
    ▶ MULA DENGAR DIALOG
  </button>

  <button id="replayButton" onclick="startDialogue()">
    ↻ DENGAR SEMULA
  </button>

</div>

<script>

const dialogues = [
  {
    character: "upin",
    name: "UPIN",
    text: "Hai, kawan-kawan! Selamat datang ke dunia Pendidikan Islam!"
  },
  {
    character: "ipin",
    name: "IPIN",
    text: "Betul, betul, betul! Seronoknya dapat belajar bersama kawan-kawan!"
  },
  {
    character: "upin",
    name: "UPIN",
    text: "Jom kita teroka sesuatu yang menarik hari ini!"
  },
  {
    character: "ipin",
    name: "IPIN",
    text: "Jangan lupa bersedia, ya! Kita akan belajar bersama-sama!"
  }
];

let current = 0;
let timer;

function showDialogue() {

  const item = dialogues[current];

  // Sembunyikan semua watak dahulu
  document.getElementById("upin").classList.remove("active");
  document.getElementById("ipin").classList.remove("active");

  // Paparkan watak yang sedang bercakap sahaja
  const character = document.getElementById(item.character);
  character.classList.add("active");

  // Paparkan dialog watak
  const dialogue = document.getElementById("dialogue");
  dialogue.style.animation = "none";
  void dialogue.offsetWidth;
  dialogue.style.animation = "muncul 0.5s ease";

  dialogue.textContent = item.name + ": " + item.text;

  current++;

  if (current < dialogues.length) {
    timer = setTimeout(showDialogue, 4500);
  } else {
    timer = setTimeout(finishDialogue, 4500);
  }
}

function startDialogue() {

  clearTimeout(timer);
  current = 0;

  document.getElementById("startButton").style.display = "none";
  document.getElementById("replayButton").style.display = "none";

  showDialogue();
}

function finishDialogue() {

  document.getElementById("upin").classList.remove("active");
  document.getElementById("ipin").classList.remove("active");

  document.getElementById("dialogue").textContent =
    "Terima kasih kerana sudi berkenalan! Jom kita kenali guru kita pula! 😊";

  document.getElementById("replayButton").style.display = "inline-block";
}

</script>

</body>
</html>
