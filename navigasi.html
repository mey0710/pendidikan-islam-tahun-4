
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigasi Kampung</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: transparent;
  font-family: "Trebuchet MS", Arial, sans-serif;
}

.nav-container {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  padding: 15px 5px;
}

.sign {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-width: 125px;
  padding: 15px 20px;
  border: 4px solid #70401e;
  border-radius: 13px 7px 14px 8px;
  background: linear-gradient(135deg, #d99b52, #a9662d, #c7833e);
  color: #fff8df;
  text-decoration: none;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.5px;
  text-shadow: 1px 2px 2px #603719;
  box-shadow: 0 7px 0 #70401e,
              0 10px 13px rgba(0,0,0,.2);
  transition: transform .25s, box-shadow .25s;
  animation: terapung 2.5s ease-in-out infinite;
}

.sign:nth-child(2) {
  animation-delay: .3s;
}

.sign:nth-child(3) {
  animation-delay: .6s;
}

.sign:hover {
  transform: translateY(-8px) rotate(-2deg) scale(1.06);
  box-shadow: 0 12px 0 #70401e,
              0 15px 18px rgba(0,0,0,.2);
}

.sign:active {
  transform: translateY(4px) scale(.96);
  box-shadow: 0 3px 0 #70401e;
}

.icon {
  font-size: 22px;
}

.home {
  background: linear-gradient(135deg, #65b96a, #267b43);
  border-color: #18572f;
  box-shadow: 0 7px 0 #18572f,
              0 10px 13px rgba(0,0,0,.2);
}

.home:hover {
  box-shadow: 0 12px 0 #18572f,
              0 15px 18px rgba(0,0,0,.2);
}

@keyframes terapung {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}

.decoration {
  text-align: center;
  font-size: 20px;
  margin-bottom: 3px;
}

@media(max-width: 430px) {
  .nav-container {
    gap: 12px;
  }

  .sign {
    min-width: 105px;
    padding: 13px 12px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="decoration">🌴 🌼 🏡 🌼 🌴</div>
<div class="nav-container" id="navigation"></div>

<script>
const pages = [
  {
    name: "Halaman Utama",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/halaman-utama"
  },
  {
    name: "Pengenalan",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/pengenalan"
  },
  {
    name: "Ruang Pembelajaran",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/ruang-pembelajaran"
  },
  {
    name: "Aktiviti Interaktif",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/aktiviti-interaktif"
  },
  {
    name: "Latihan Pengukuhan",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/latihan-pengukuhan"
  },
  {
    name: "Maklum Balas",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/maklum-balas"
  },
  {
    name: "Penutup",
    url: "https://sites.google.com/moe-dl.edu.my/hadis-memuliakan-tetamud4/penutup"
  }
];

// Nombor halaman ditentukan melalui pautan ?page=
const params = new URLSearchParams(window.location.search);
const currentPage = Math.min(
  pages.length - 1,
  Math.max(0, Number(params.get("page")) || 0)
);

const nav = document.getElementById("navigation");

function createButton(label, icon, url, extraClass = "") {
  const a = document.createElement("a");
  a.className = "sign " + extraClass;
  a.href = url;
  a.target = "_top";

  const symbol = document.createElement("span");
  symbol.className = "icon";
  symbol.textContent = icon;

  const text = document.createElement("span");
  text.textContent = label;

  a.append(symbol, text);
  return a;
}

// Butang kembali: tiada pada halaman utama
if (currentPage > 0) {
  nav.appendChild(
    createButton(
      "KEMBALI",
      "◀",
      pages[currentPage - 1].url
    )
  );
}

// Butang halaman utama: tiada pada halaman utama
if (currentPage > 0) {
  nav.appendChild(
    createButton(
      "UTAMA",
      "🏡",
      pages[0].url,
      "home"
    )
  );
}

// Butang seterusnya: tiada pada halaman terakhir
if (currentPage < pages.length - 1) {
  nav.appendChild(
    createButton(
      "SETERUSNYA",
      "▶",
      pages[currentPage + 1].url
    )
  );
}
</script>

</body>
</html>
