
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misi 1 - Jom Tonton!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Trebuchet MS', Arial, sans-serif;
  color: #315b38;
  background: linear-gradient(135deg, #b9e9a9, #fff0b8, #b5e6ee);
  min-height: 100vh;
  padding: 25px 15px;
}

.container {
  max-width: 950px;
  margin: auto;
  background: #fffdf4;
  border: 5px solid white;
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 12px 30px #315b3830;
}

.top {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(135deg, #72c96a, #b5e88a);
  border-bottom: 6px solid #f6cb50;
}

.misi {
  display: inline-block;
  background: #f7bc35;
  color: white;
  padding: 10px 25px;
  border-radius: 30px;
  border: 3px solid white;
  font-weight: bold;
  box-shadow: 0 4px 0 #d89b20;
}

h1 {
  color: white;
  font-size: clamp(28px, 5vw, 43px);
  text-shadow: 3px 3px #479b48;
  margin: 15px 0 5px;
}

.subtitle {
  color: #285c32;
  font-weight: bold;
}

.content {
  padding: 25px;
}

.dialog-card {
  background: linear-gradient(135deg, #fff6d8, #fffdf0);
  border: 3px solid #f4c44d;
  border-radius: 25px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: 0 7px 0 #e9d89e;
}

.character {
  width: 210px;
  flex-shrink: 0;
  text-align: center;
}

.mail-image {
  width: 190px;
  height: 190px;
  object-fit: contain;
  animation: lompat 2s infinite;
}

.character h3 {
  background: #f4bd43;
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  display: inline-block;
  margin: 5px;
}

.character small {
  display: block;
  color: #72915c;
}

.bubble-area {
  flex: 1;
  min-width: 0;
}

.bubble {
  background: white;
  border: 3px solid #83c96e;
  border-radius: 25px;
  padding: 20px;
  min-height: 155px;
  position: relative;
}

.bubble::before {
  content: "";
  position: absolute;
  left: -17px;
  top: 35px;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-right: 17px solid #83c96e;
}

.speaker {
  color: #e99d21;
  font-size: 18px;
  font-weight: bold;
}

#dialogText {
  font-size: 19px;
  line-height: 1.6;
  font-weight: bold;
  margin: 12px 0;
  min-height: 55px;
}

.progress {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 20px 0;
}

.dot {
  width: 12px;
  height: 12px;
  background: #d7e5cc;
  border-radius: 50%;
  transition: 0.3s;
}

.dot.active {
  background: #65b75a;
  transform: scale(1.3);
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: none;
  padding: 13px 23px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-3px);
}

.next {
  background: #f5bd39;
  color: white;
  box-shadow: 0 4px 0 #d49b23;
}

.next:hover {
  background: #e8a91c;
}

.restart {
  background: #82c96d;
  color: white;
  display: none;
}

.video-section {
  margin-top: 35px;
}

.section-title {
  background: #83c96e;
  color: white;
  text-align: center;
  padding: 15px;
  border-radius: 18px;
  border-bottom: 5px solid #60a94f;
}

.section-title h2 {
  margin: 0;
}

.section-title p {
  margin: 7px 0 0;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 6px solid #f4bd43;
  border-radius: 22px;
  overflow: hidden;
  margin-top: 15px;
  background: #263b26;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.tip {
  background: #e5f4ff;
  border: 2px dashed #76b9d8;
  padding: 16px;
  border-radius: 18px;
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}

.footer {
  text-align: center;
  background: #e8f5d9;
  padding: 15px;
  font-weight: bold;
  color: #639653;
}

@keyframes lompat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width: 600px) {
  .content {
    padding: 15px;
  }

  .dialog-card {
    flex-direction: column;
  }

  .character {
    width: 100%;
  }

  .mail-image {
    width: 155px;
    height: 155px;
  }

  .bubble::before {
    display: none;
  }

  #dialogText {
    text-align: center;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="top">
    <div class="misi">🚀 MISI 1</div>
    <h1>JOM TONTON! 📺</h1>
    <p class="subtitle">
      Mari belajar sambil berseronok!
    </p>
  </header>

  <main class="content">

    <!-- WATAK MAIL -->

    <div class="dialog-card">

      <div class="character">

        <img
          src="mail.png"
          alt="Mail Upin dan Ipin"
          class="mail-image"
        >

        <h3>MAIL</h3>
        <small>Rakan Upin dan Ipin</small>

      </div>

      <!-- DIALOG SATU DEMI SATU -->

      <div class="bubble-area">

        <div class="bubble">

          <div class="speaker">
            💬 MAIL:
          </div>

          <p id="dialogText">
            Hai, kawan-kawan! 👋
          </p>

        </div>

        <div class="progress" id="progress"></div>

        <div class="controls">

          <button
            class="next"
            id="nextBtn"
            onclick="nextDialog()"
          >
            Seterusnya ➜
          </button>

          <button
            class="restart"
            id="restartBtn"
            onclick="restartDialog()"
          >
            ↻ Ulang Semula
          </button>

          <button
            class="next"
            id="watchBtn"
            style="display:none"
            onclick="watchVideo()"
          >
            Jom Tonton! 📺
          </button>

        </div>

      </div>

    </div>

    <!-- VIDEO PEMBELAJARAN -->

    <section class="video-section" id="videoSection">

      <div class="section-title">

        <h2>🎬 VIDEO PEMBELAJARAN</h2>

        <p>Jom kita tonton bersama-sama!</p>

      </div>

      <div class="video">

        <iframe
          src="https://www.youtube.com/embed/QuUmJaMXXg8"
          title="Video Pembelajaran"
          allowfullscreen>
        </iframe>

      </div>

      <div class="tip">
        💡 Ingat! Tonton video sehingga selesai
        dan perhatikan setiap perkara penting.
      </div>

    </section>

  </main>

  <footer class="footer">
    🌻 Selamat Belajar! Teruskan Pengembaraan Ilmu! 🌻
  </footer>

</div>

<script>

const dialogs = [
  "Hai, kawan-kawan! 👋",

  "Jom kita tonton video ini bersama-sama! 🎬",

  "Perhatikan dengan teliti, ya! 👀",

  "Hehehe! Jangan terlepas perkara penting dalam video ini! 😄"
];

let currentDialog = 0;

function showProgress() {

  const progress = document.getElementById("progress");

  progress.innerHTML = "";

  dialogs.forEach((item, index) => {

    const dot = document.createElement("div");

    dot.className = "dot";

    if (index <= currentDialog) {
      dot.classList.add("active");
    }

    progress.appendChild(dot);

  });

}

function nextDialog() {

  if (currentDialog < dialogs.length - 1) {

    currentDialog++;

    const text = document.getElementById("dialogText");

    text.style.animation = "none";

    void text.offsetHeight;

    text.style.animation = "muncul 0.5s ease";

    text.textContent = dialogs[currentDialog];

    showProgress();

  }

  if (currentDialog === dialogs.length - 1) {

    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("restartBtn").style.display = "inline-block";

    document.getElementById("watchBtn").style.display = "inline-block";

  }

}

function restartDialog() {

  currentDialog = 0;

  document.getElementById("dialogText").textContent = dialogs[0];

  document.getElementById("nextBtn").style.display = "inline-block";

  document.getElementById("restartBtn").style.display = "none";

  document.getElementById("watchBtn").style.display = "none";

  showProgress();

}

function watchVideo() {

  document.getElementById("videoSection").scrollIntoView({
    behavior: "smooth"
  });

}

showProgress();

</script>

</body>
</html>
