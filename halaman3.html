
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi 1 - Jom Tonton</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#dff5d9, #fff4cf);
  text-align: center;
  color: #315d39;
  padding: 25px 15px;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 5px 15px #0002;
}

.misi {
  background: #f5bd43;
  color: #fff;
  display: inline-block;
  padding: 10px 25px;
  border-radius: 30px;
  font-weight: bold;
}

h1 {
  font-size: 36px;
  margin: 15px 0;
}

p {
  font-size: 18px;
  line-height: 1.6;
}

.video {
  margin: 25px auto;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 7px solid #f5bd43;
  border-radius: 18px;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.tip {
  background: #fff1c9;
  padding: 15px;
  border-radius: 15px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

  <div class="misi">🚀 MISI 1</div>

  <h1>JOM TONTON! 📺</h1>

  <p>
    Hai, kawan-kawan! 👋
    <br>
    Mari kita tonton video ini bersama-sama.
    Perhatikan dengan teliti, ya!
  </p>

  <div class="video">
    <iframe
      src="https://www.youtube.com/embed/Mk1j0-peUbs"
      title="Video Pembelajaran"
      allowfullscreen>
    </iframe>
  </div>

  <div class="tip">
    💡 Ingat! Tonton video sehingga selesai
    dan perhatikan perkara penting di dalamnya.
  </div>

</div>

</body>
</html>
