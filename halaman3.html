
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi 1 - Jom Tonton!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: linear-gradient(#dff4d8, #fff2cc);
  color: #315d39;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 8px 20px #0002;
}

.heading {
  text-align: center;
}

.misi {
  display: inline-block;
  background: #f4bd43;
  color: white;
  padding: 10px 25px;
  border-radius: 30px;
  font-weight: bold;
}

h1 {
  font-size: 35px;
  margin: 15px 0;
}

.dialog {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 30px 0;
  animation: muncul 1s ease;
}

.character {
  width: 190px;
  flex-shrink: 0;
  text-align: center;
}

.character .emoji {
  font-size: 100px;
  animation: lompat 2s infinite;
}

.character h3 {
  margin: 5px;
  color: #d68b16;
}

.bubble {
  background: #fff0c9;
  border: 3px solid #f3c75e;
  padding: 22px;
  border-radius: 25px;
  font-size: 19px;
  line-height: 1.6;
  position: relative;
  flex: 1;
  min-height: 170px;
}

.bubble:before {
  content: "";
  position: absolute;
  left: -17px;
  top: 40px;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-right: 17px solid #f3c75e;
}

#dialogText {
  min-height: 55px;
}

#nextBtn {
  background: #f4bd43;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

#nextBtn:hover {
  background: #d68b16;
}

.video-title {
  background: #dff1dd;
  padding: 12px;
  border-radius: 15px;
  margin-top: 25px;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 7px solid #f4bd43;
  border-radius: 18px;
  overflow: hidden;
  margin-top: 15px;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.tip {
  background: #e7f2ff;
  padding: 15px;
  border-radius: 15px;
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes lompat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@media(max-width: 550px) {
  .dialog {
    flex-direction: column;
  }

  .bubble:before {
    display: none;
  }

  .character {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="heading">
    <div class="misi">🚀 MISI 1</div>
    <h1>JOM TONTON! 📺</h1>
  </div>

  <div class="dialog">

    <div class="character">
      <div class="emoji">👦🏻</div>
      <h3>MAIL</h3>
      <small>Rakan Upin dan Ipin</small>
    </div>

    <div class="bubble">
      <strong>MAIL:</strong>

      <p id="dialogText">
        Hai, kawan-kawan! 👋
      </p>

      <button id="nextBtn" onclick="nextDialog()">
        Seterusnya ➜
      </button>
    </div>

  </div>

  <div class="video-title">
    <h2>🎬 VIDEO PEMBELAJARAN</h2>
    <p>Jom kita tonton bersama-sama!</p>
  </div>

  <div class="video">
    <iframe
      src="https://www.youtube.com/embed/QuUmJaMXXg8"
      title="Video Pembelajaran"
      allowfullscreen>
    </iframe>
  </div>

  <div class="tip">
    💡 Ingat! Tonton video sehingga selesai dan perhatikan dengan teliti.
  </div>

</div>

<script>
const dialogs = [
  "Hai, kawan-kawan! 👋",
  "Jom kita tonton video ini bersama-sama. 🎬",
  "Perhatikan dengan teliti, ya! 👀",
  "Hehehe! Jangan terlepas perkara penting dalam video ini! 😄"
];

let currentDialog = 0;

function nextDialog() {
  currentDialog++;

  const text = document.getElementById("dialogText");
  const button = document.getElementById("nextBtn");

  if (currentDialog < dialogs.length) {
    text.style.animation = "none";
    text.offsetHeight;
    text.style.animation = "muncul 0.5s ease";
    text.innerHTML = dialogs[currentDialog];
  }

  if (currentDialog === dialogs.length - 1) {
    button.innerHTML = "Jom Tonton! 📺";

    button.onclick = function() {
      document.querySelector(".video-title").scrollIntoView({
        behavior: "smooth"
      });
    };
  }
}
</script>

</body>
</html>
