
<style>
.mail-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  max-width: 650px;
  margin: 25px auto;
}

.mail-picture {
  width: 160px;
  height: 190px;
  object-fit: contain;
}

.mail-dialogue {
  flex: 1;
  background: #fff2c6;
  border: 3px solid #f4cd58;
  border-radius: 22px;
  padding: 20px;
  text-align: left;
  box-shadow: 0 5px 12px #00000015;
}

.mail-speaker {
  color: #d18417;
  font-weight: bold;
  font-size: 20px;
  margin-bottom: 12px;
}

#mailText {
  font-size: 17px;
  line-height: 1.7;
  min-height: 90px;
  color: #59451f;
}

.mail-next {
  background: #35a75b;
  color: white;
  border: none;
  padding: 11px 22px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: bold;
}

@media(max-width:500px) {
  .mail-area {
    flex-direction: column;
  }
  .mail-picture {
    width: 130px;
    height: 145px;
  }
  .mail-dialogue {
    width: 100%;
  }
}
</style>

<div class="mail-area">

  <!-- GAMBAR MAIL -->
  <img
    src="mail.png"
    alt="Watak Mail"
    class="mail-picture"
  >

  <!-- GELEMBUNG DIALOG -->
  <div class="mail-dialogue">

    <div class="mail-speaker">💬 MAIL:</div>

    <p id="mailText">Hai kawan-kawan! 👋</p>

    <button class="mail-next" id="mailNext"
      onclick="nextMailDialogue()">
      Seterusnya ➜
    </button>

  </div>
</div>

<script>
const mailDialogues = [
  "Hai kawan-kawan! 👋",
  "Hari ini Mail nak ajak kamu semua tonton satu video.",
  "Cuba perhatikan video ini dengan teliti, ya!",
  "Selepas menonton, cuba teka apakah yang akan kita pelajari pada hari ini.",
  "Jom tonton bersama-sama! 📺"
];

let mailIndex = 0;

function nextMailDialogue() {
  mailIndex++;

  if (mailIndex < mailDialogues.length) {
    document.getElementById("mailText").textContent =
      mailDialogues[mailIndex];
  } else {
    document.getElementById("mailText").textContent =
      "Bagus kawan-kawan! Sekarang jom kita tonton video! 🎉";

    document.getElementById("mailNext").style.display = "none";
  }
}
</script>
