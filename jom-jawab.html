<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Jawab!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    color: #222;
}

.subtitle {
    color: #777;
    font-size: 14px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin-top: 8px;
    font-family: Arial, sans-serif;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    background: #e62117;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.status {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

.comment {
    display: flex;
    gap: 12px;
    margin-top: 18px;
}

.avatar {
    background: #e5e5e5;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.comment-content {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 12px;
    flex: 1;
    overflow-wrap: anywhere;
}

.comment-content strong {
    font-size: 14px;
}

.comment-content p {
    margin-bottom: 0;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>💬 JOM JAWAB!</h2>
        <p class="subtitle">Kongsikan jawapan kamu berdasarkan pembelajaran hari ini.</p>

        <label><strong>Nama murid</strong></label>
        <input type="text" id="namaMurid" placeholder="Masukkan nama kamu">
    </div>

    <div class="card">
        <h3>1. Apakah yang kamu tonton daripada video tadi?</h3>
        <textarea id="jawapan1" placeholder="Tulis jawapan kamu di sini..."></textarea>
    </div>

    <div class="card">
        <h3>2. Apakah pengajaran yang boleh kita amalkan dalam kehidupan seharian?</h3>
        <textarea id="jawapan2" placeholder="Tulis jawapan kamu di sini..."></textarea>
    </div>

    <div class="card">
        <button id="butangHantar" onclick="hantarJawapan()">
            HANTAR JAWAPAN
        </button>

        <div class="status" id="statusHantar"></div>
    </div>

    <div class="card">
        <h3>💬 Ruang Jawapan Murid</h3>
        <div id="paparanJawapan">
            <p class="subtitle">Jawapan yang dihantar akan dipaparkan di sini.</p>
        </div>
    </div>

</div>

<script>
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyYu3S41Wnfwwe-ijvD2rc0AgGlGahX7QWPbio8nyPGMr3AYMQfb3HWqNypdAd6IDbb/exec";

function hantarJawapan() {

    const nama = document.getElementById("namaMurid").value.trim();
    const jawapan1 = document.getElementById("jawapan1").value.trim();
    const jawapan2 = document.getElementById("jawapan2").value.trim();

    const status = document.getElementById("statusHantar");
    const butang = document.getElementById("butangHantar");

    if (!nama || !jawapan1 || !jawapan2) {
        status.style.color = "red";
        status.textContent = "Sila lengkapkan nama dan kedua-dua jawapan dahulu.";
        return;
    }

    const data = {
        nama: nama,
        jawapan1: jawapan1,
        jawapan2: jawapan2
    };

    butang.disabled = true;
    butang.textContent = "SEDANG MENGHANTAR...";
    status.style.color = "#555";
    status.textContent = "Sedang menghantar jawapan...";

    fetch(URL_APPS_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
    })
    .then(() => {

        status.style.color = "green";
        status.textContent = "Permintaan telah dihantar. Sila semak Google Sheets.";

        const paparan = document.getElementById("paparanJawapan");

        const komen = document.createElement("div");
        komen.className = "comment";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "👤";

        const kandungan = document.createElement("div");
        kandungan.className = "comment-content";

        const namaMurid = document.createElement("strong");
        namaMurid.textContent = nama;

        const teks1 = document.createElement("p");
        teks1.textContent = "1. " + jawapan1;

        const teks2 = document.createElement("p");
        teks2.textContent = "2. " + jawapan2;

        kandungan.appendChild(namaMurid);
        kandungan.appendChild(teks1);
        kandungan.appendChild(teks2);

        komen.appendChild(avatar);
        komen.appendChild(kandungan);

        paparan.innerHTML = "";
        paparan.appendChild(komen);

        document.getElementById("namaMurid").value = "";
        document.getElementById("jawapan1").value = "";
        document.getElementById("jawapan2").value = "";

        butang.disabled = false;
        butang.textContent = "HANTAR JAWAPAN";

    })
    .catch(() => {

        status.style.color = "red";
        status.textContent = "Penghantaran gagal. Sila cuba lagi.";

        butang.disabled = false;
        butang.textContent = "HANTAR JAWAPAN";

    });
}
</script>

</body>
</html>
