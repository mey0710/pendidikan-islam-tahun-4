
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengenalan Pembelajaran</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

.tajuk-tengah {
  text-align: center;
  color: #8B4513;
  font-size: 28px;
  font-weight: bold;
  animation: gerakTengah 2s ease-in-out infinite alternate;
}

@keyframes gerakTengah {
  from { transform: translateX(-20px); }
  to { transform: translateX(20px); }
}
</style>
</head>

<body>

<div class="tajuk-tengah">
  APA YANG KITA NAK BELAJAR HARI NI? 🤔
</div>
