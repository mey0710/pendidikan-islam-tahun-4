
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salam Mesra Ustazah</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.kawasan {
  position: relative;
  min-height: 350px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Papan kayu */
.papan {
  position: relative;
  z-index: 1;
  width: 75%;
  max-width: 650px;
  padding: 28px 25px;
  box-sizing: border-box;
  text-align: center;
  color: #fff8df;
  border: 9px solid #75421e;
  border-radius: 12px;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(80, 38, 12, 0.18) 0px,
      rgba(80, 38, 12, 0.18) 3px,
      transparent 3px,
      transparent 17px
    ),
    linear-gradient(135deg, #bd8247, #8b572b, #c18a50);
  box-shadow: 5px 8px 14px #0005;
  opacity: 0;
  animation: papanMasuk 1.5s ease-out forwards;
  animation-delay: 0.5s;
}

.papan h2 {
  color: #ffdf55;
  font-size: 25px;
  margin: 5px 0 18px;
  text-shadow: 2px 2px 3px #4b260e;
}

.papan p {
  font-size: 17px;
  line-height: 1.6;
  margin: 9px 0;
  font-weight: bold;
  text-shadow: 1px 1px 2px #4b260e;
}

/* Rembo */
.rembo {
  position: absolute;
  z-index: 2;
  width: 125px;
  height: auto;
  left: -150px;
  bottom: 35px;
  animation: remboMasuk 2s ease-out forwards;
}

/* Animasi papan */
@keyframes papanMasuk {
  from {
    opacity: 0;
    transform: translateX(120px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Animasi Rembo */
@keyframes remboMasuk {
  from {
    left: -150px;
  }
  to {
    left: 5%;
  }
}
</style>
</head>

<body>

<div class="kawasan">

  <div class="papan">
    <h2>🌸 SALAM MESRA DARIPADA USTAZAH 🌸</h2>

    <p>Assalamualaikum warahmatullahi wabarakatuh! 👋</p>

    <p>Hai anak-anak yang dikasihi!</p>

    <p>Selamat datang ke laman pembelajaran Ustazah.</p>

    <p>Semoga anak-anak sentiasa ceria dan bersemangat untuk belajar.</p>

    <p>Jom kita belajar bersama-sama! 📚✨</p>
  </div>

  <img src="./rembo.png" class="rembo" alt="Rembo"
       onerror="this.alt='Gambar Rembo tidak dijumpai'; this.style.background='#fff';">

</div>

</body>
</html>
